name: Update profile statistics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-profile.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'SuhangXia/suhangxia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public repository statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Commit refreshed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/stats/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
