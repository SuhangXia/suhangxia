      <line x1="745" y1="207" x2="1225" y2="207"/><line x1="745" y1="259" x2="1225" y2="259"/>
      <line x1="825" y1="51" x2="825" y2="309"/><line x1="905" y1="51" x2="905" y2="309"/>
      <line x1="985" y1="51" x2="985" y2="309"/><line x1="1065" y1="51" x2="1065" y2="309"/>
      <line x1="1145" y1="51" x2="1145" y2="309"/>
    </g>
    <path d="M745 244 C777 244 781 235 801 235 C824 235 832 251 854 249 C878 247 884 212 907 210 C930 208 940 233 960 228 C981 223 986 176 1008 174 C1031 172 1040 206 1060 198 C1082 189 1086 130 1111 129 C1137 127 1138 171 1162 157 C1183 145 1191 90 1225 80" fill="none" stroke="#f1efe8" stroke-opacity="0.2" stroke-width="7"/>
    <path d="M745 244 C777 244 781 235 801 235 C824 235 832 251 854 249 C878 247 884 212 907 210 C930 208 940 233 960 228 C981 223 986 176 1008 174 C1031 172 1040 206 1060 198 C1082 189 1086 130 1111 129 C1137 127 1138 171 1162 157 C1183 145 1191 90 1225 80" fill="none" stroke="url(#signal)" stroke-width="2.5"/>
    <path d="M745 282 C795 276 820 287 857 272 C895 257 919 278 952 258 C984 238 1016 258 1048 230 C1084 199 1112 218 1144 187 C1174 158 1194 163 1225 142" fill="none" stroke="#f1efe8" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="5 7"/>
  </g>

  <g fill="#b54b32" filter="url(#glow)">
    <circle cx="907" cy="210" r="4"/><circle cx="1008" cy="174" r="4"/><circle cx="1111" cy="129" r="4"/><circle cx="1225" cy="80" r="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="757" y="76" fill="#777d75">ACTION CONFIDENCE</text>
    <text x="1169" y="296" fill="#777d75">t →</text>
    <text x="1177" y="71" fill="#e47a5d">0.94</text>
  </g>

  <g transform="translate(706 76)">
