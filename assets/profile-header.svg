<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Suhang Xia — Robotics Researcher</title>
  <desc id="desc">A dark scientific instrument-style header with a signal plot and research coordinates.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111411"/>
      <stop offset="0.56" stop-color="#171917"/>
      <stop offset="1" stop-color="#202420"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f3324"/>
      <stop offset="0.5" stop-color="#b54b32"/>
      <stop offset="1" stop-color="#e47a5d"/>
    </linearGradient>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f1efe8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="plotClip"><rect x="745" y="51" width="480" height="258" rx="2"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="8" fill="url(#panel)"/>
  <rect width="1280" height="360" rx="8" fill="url(#microgrid)"/>
  <path d="M0 0H1280V360H0Z" fill="none" stroke="#f1efe8" stroke-opacity="0.14"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="56" fill="#b54b32" font-size="13" font-weight="700" letter-spacing="2.4">RESEARCH PROFILE / 01</text>
    <text x="56" y="142" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="650" letter-spacing="-2.5">Suhang Xia</text>
    <text x="59" y="185" fill="#c9cbc6" font-size="17" letter-spacing="1">ROBOTICS RESEARCHER + SYSTEMS ENGINEER</text>

    <line x1="58" y1="218" x2="676" y2="218" stroke="#f1efe8" stroke-opacity="0.18"/>

    <g font-size="13">
      <text x="58" y="254" fill="#777d75">FOCUS_01</text>
      <text x="142" y="254" fill="#f1efe8">VISUOTACTILE LEARNING</text>
      <text x="58" y="282" fill="#777d75">FOCUS_02</text>
      <text x="142" y="282" fill="#f1efe8">PHYSICAL ROBOT SYSTEMS</text>
      <text x="58" y="310" fill="#777d75">FOCUS_03</text>
      <text x="142" y="310" fill="#f1efe8">SURGICAL ROBOTICS</text>
    </g>
  </g>

  <g clip-path="url(#plotClip)">
