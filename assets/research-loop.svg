<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Suhang Xia's research loop</title>
  <desc id="desc">Five linked stages: perceive, represent, reason, act, and verify, connected by a feedback loop.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#f1efe8" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b54b32"/>
    </marker>
  </defs>

  <rect width="1280" height="280" rx="8" fill="#171917"/>
  <rect width="1280" height="280" rx="8" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="279" rx="7.5" fill="none" stroke="#f1efe8" stroke-opacity="0.12"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="42" y="43" fill="#b54b32" font-size="12" font-weight="700" letter-spacing="2.2">CLOSED-LOOP ROBOT INTELLIGENCE</text>
    <text x="1238" y="43" text-anchor="end" fill="#686e67" font-size="11">SIGNALS → DECISIONS → PHYSICAL EVIDENCE</text>
  </g>

  <g stroke="#b54b32" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M236 139H294"/><path d="M470 139H528"/><path d="M704 139H762"/><path d="M938 139H996"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(42 83)">
      <rect width="194" height="112" rx="3" fill="#202320" stroke="#f1efe8" stroke-opacity="0.18"/>
      <text x="18" y="27" fill="#b54b32" font-size="11">01 / INPUT</text>
      <text x="18" y="58" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Perceive</text>
      <text x="18" y="85" fill="#92978f" font-size="11">RGB · TOUCH · FORCE</text>
    </g>
    <g transform="translate(294 83)">
      <rect width="176" height="112" rx="3" fill="#202320" stroke="#f1efe8" stroke-opacity="0.18"/>
      <text x="18" y="27" fill="#b54b32" font-size="11">02 / LATENT</text>
      <text x="18" y="58" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Represent</text>
      <text x="18" y="85" fill="#92978f" font-size="11">ALIGN · ENCODE</text>
    </g>
    <g transform="translate(528 83)">
      <rect width="176" height="112" rx="3" fill="#202320" stroke="#f1efe8" stroke-opacity="0.18"/>
      <text x="18" y="27" fill="#b54b32" font-size="11">03 / POLICY</text>
      <text x="18" y="58" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Reason</text>
      <text x="18" y="85" fill="#92978f" font-size="11">INFER · PLAN</text>
    </g>
    <g transform="translate(762 83)">
      <rect width="176" height="112" rx="3" fill="#202320" stroke="#f1efe8" stroke-opacity="0.18"/>
      <text x="18" y="27" fill="#b54b32" font-size="11">04 / ROBOT</text>
      <text x="18" y="58" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Act</text>
      <text x="18" y="85" fill="#92978f" font-size="11">MOVE · INTERACT</text>
    </g>
    <g transform="translate(996 83)">
      <rect width="242" height="112" rx="3" fill="#202320" stroke="#b54b32" stroke-opacity="0.8"/>
      <text x="18" y="27" fill="#b54b32" font-size="11">05 / EVIDENCE</text>
      <text x="18" y="58" fill="#f7f5ef" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">Verify</text>
      <text x="18" y="85" fill="#92978f" font-size="11">MEASURE · AUDIT · RETRY</text>
    </g>
  </g>

  <path d="M1117 210V235H139V210" fill="none" stroke="#b54b32" stroke-width="1.25" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="628" y="257" text-anchor="middle" fill="#777d75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.8">FEEDBACK / UNCERTAINTY / RECALIBRATION</text>
</svg>
